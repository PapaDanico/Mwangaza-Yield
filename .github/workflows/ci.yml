name: CI & Daily Data Refresh

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Scheduled 06:17 and 18:17 EAT (03:17 and 15:17 UTC), Monday to Saturday.
    #
    # SCHEDULED IS NOT WHEN IT RUNS, AND THE DIFFERENCE IS HOURS.
    #
    # GitHub queues scheduled workflows, so the slot is the earliest it can
    # start rather than when it does. Measured on this repository's own
    # history — every scheduled run against the previous `0 3` slot:
    #
    #     scheduled 06:00 EAT  ->  actually ran 08:41 to 09:23 EAT
    #
    # created_at equals run_started_at in all six, so GitHub was creating the
    # run late, not the job running long. In practice a reader in Nairobi sees
    # the morning figures around 09:00 EAT and the evening ones around
    # 21:00 EAT, not 06:00 and 18:00.
    #
    # That still satisfies the reasoning below — 21:00 EAT is the same evening
    # as a Thursday auction — but the times in this file are the times we ASK
    # for, and nothing here should be read as a promise about when data lands.
    # data-freshness.ts carries a four-hour grace period for exactly this, so
    # the site does not tell readers an update was missed when it is merely
    # queued.
    #
    # WHY TWICE, AND WHY SATURDAY
    #
    # One 6am run means every figure is up to a full DAY behind, and the lag
    # lands worst exactly where it matters most. CBK auctions Treasury bills on
    # Thursday and publishes results that evening; a 6am-only schedule reads
    # them on Friday morning, so the site shows last week's rates for the whole
    # of Thursday — the day a reader deciding whether to bid is most likely to
    # look. The 6pm run reads them the same evening.
    #
    # The same applies to the indicative USD/KES rate, which CBK republishes
    # every trading day, and to bond auction results, which land in the
    # afternoon.
    #
    # Saturday exists because Friday afternoon publications otherwise wait
    # until Monday 6am — up to 62 hours, over a weekend when nothing else on
    # the site changes to hint that the figures have not.
    #
    # Sunday is deliberately left out: nothing this project reads is published
    # on a Sunday, and a run that can only ever find nothing is a run whose
    # failures are pure noise.
    # MINUTE 17, NOT 0, AND THAT IS THE POINT.
    #
    # GitHub runs scheduled workflows off a shared queue and the top of the
    # hour is its most contended minute. Every scheduled run on this repository
    # since 2026-07-25, against a `0 3` slot, was created between 2h41m and
    # 3h23m late — created_at equals run_started_at in all six, so GitHub was
    # creating the run late, not the job running long.
    #
    # An off-peak minute is GitHub's own documented advice and costs nothing.
    # It will not eliminate the delay; data-freshness.ts carries a four-hour
    # grace period for what remains, measured against that same history.
    - cron: '17 3,15 * * 1-6'
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Probe live sources and report, without writing or committing data'
        type: boolean
        default: true
      test_alert:
        description: 'Self-test the alerting path: force a freshness failure and confirm the issue is raised. Commits nothing.'
        type: boolean
        default: false
      test_recovery:
        description: 'Self-test the RECOVERY path: raise a throwaway alert, then prove a healthy run closes it. Commits nothing.'
        type: boolean
        default: false
      refresh_now:
        description: 'Run the scrapers and commit fresh data immediately, without waiting for the 6am EAT schedule.'
        type: boolean
        default: false

# Cancel any in-progress run for the same branch or PR the moment a newer
# commit arrives, so a rapid sequence of commits does not stack up concurrent
# runs racing through the runner pool.
#
# THE EXEMPTION IS IN THE GROUP, NOT IN THE FLAG, AND THAT IS THE WHOLE POINT.
#
# `cancel-in-progress` is evaluated on the INCOMING run and decides whether it
# cancels others in its group. It does not protect the run it is set on. So
# setting it false for `schedule` only stops a scheduled run from cancelling
# other things — it does nothing to stop a push from cancelling the refresh.
#
# And a push would. A scheduled run's `github.ref` is `refs/heads/main`, which
# is also the ref of every push to main, so keying the group on ref alone puts
# them in the SAME group. The refresh job commits and pushes its data to main,
# which means the collision is on the normal path rather than a corner case:
# the refresh could cancel its own successor, or a routine merge could kill a
# refresh mid-write.
#
# That last case is why this matters beyond wasted minutes. write_dataset is
# atomic now (os.replace, see backend/scrapers/common.py), so a cancelled run
# leaves the previous dataset intact rather than a truncated file — but the
# guarantee is only worth having if the cancellation is intentional.
#
# Putting `github.run_id` in the group for the events that must finish gives
# each of them a group of one, which nothing else can ever join and therefore
# nothing can cancel. Push and pull_request runs keep sharing the `-ci` group
# and keep superseding each other, which is the intended behaviour.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.run_id || 'ci'
    }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Typecheck EVERYTHING, not just what next build compiles.
      #
      # `next build` typechecks the app and injects its own compiler target, so
      # it stayed green while `tsc --noEmit` failed on main: a test file used
      # `[...str.matchAll(re)]`, which is fine under any modern target and
      # TS2802 under the ES5 default a bare tsc fell back to. The target is now
      # pinned in tsconfig.json; this step is what makes the gap visible if it
      # ever reopens, since tests and scripts are outside the build's reach.
      - run: npm run typecheck

      # Lint runs here because until now it ran NOWHERE.
      #
      # `npm run lint` was `next lint` with no ESLint config and no eslint
      # dependency, so invoking it dropped you into Next's interactive setup
      # prompt — it could not pass or fail, and CI never called it. The cost was
      # not hypothetical: both report components carried an
      # `eslint-disable-next-line @next/next/no-img-element` comment that
      # suppressed nothing, because an explanatory comment sat between the
      # disable and the <img> it was meant to cover. Somebody wrote the
      # suppression, and no tool ever told them it was inert.
      #
      # --max-warnings 0 because the tree is at zero today. A warning budget
      # accumulates until nobody reads the output.
      - run: npm run lint

      - run: npm run build

      # The unit suite proves the maths; this proves the reader sees it. Every
      # defect found in the July review was invisible to 382 unit tests — a
      # mark-to-market column that had never rendered for anybody, a yield
      # printed without the guard the calculator applies, and copy claiming
      # prices we do not hold. All three are page-level facts, so they need a
      # page. Runs AFTER build because it serves ./out.
      #
      # The browser build is tied to the playwright-core version: install a
      # different one and launch() fails looking for a revision that is not
      # there. Deriving the version from the installed package means a future
      # dependency bump cannot silently break this job.
      - name: Install Chromium for the browser smoke tests
        run: |
          PW=$(node -p "require('playwright-core/package.json').version")
          npx --yes "playwright@${PW}" install --with-deps chromium
      # BOUNDED, AND DELIBERATELY WITHOUT A `|| echo` GUARD.
      #
      # This step had no bound of any kind — not `timeout-minutes`, not a shell
      # timeout, and the suite sets no global Playwright timeout. #176 put every
      # scraper behind a shell bound and this step was simply missed, so a
      # deadlocked browser would have run to GitHub's six-hour job limit while
      # the pull request sat there looking busy.
      #
      # THE NUMBER IS MEASURED, NOT PICKED. Observed on this runner:
      #
      #     09:24:54 -> 09:26:58   124 seconds, server-render check included
      #
      # 600s is roughly five times that. A cold or contended runner is slower
      # than a warm one and must still pass; a hang must not cost six hours.
      # The BUDGET_SECONDS defect earlier the same day was a bound chosen for a
      # comfortable-looking margin rather than derived from what success costs,
      # and it could never succeed. This one is derived.
      #
      # NO `|| echo "failed=..."` HERE, AND THAT IS THE POINT.
      #
      # Every scraper carries that guard because a failing scraper must be
      # RECORDED while the rest of the pipeline continues. The opposite is true
      # here: a browser suite that fails or hangs means the site is broken for
      # readers, and the build must go red. `timeout` returns 124 on expiry,
      # which fails the step, which is the intended outcome. Anyone adding a
      # `||` to this line to "make CI less flaky" would be turning the check
      # off — the exact failure this file has spent its comments arguing
      # against, and pipeline-alert.test.ts fails if it appears.
      - name: Browser smoke tests
        run: timeout -k 20s 600s npm run test:e2e

      # The CSP is EXERCISED, not reviewed.
      #
      # A wrong directive breaks the site in production only — that property is
      # exactly why this repository shipped without a policy for so long, and
      # it is why a header string cannot be signed off by reading it. This step
      # serves ./out under the real policy parsed from netlify.toml and fails
      # on any console violation, so a directive that would break production
      # breaks the pull request instead.
      #
      # Bounded like the suite above, and deliberately WITHOUT a `|| echo`
      # guard: a policy that breaks a page must turn the run red.
      #
      # Chromium is already installed by the step above, and the browser is
      # only usable if that install ran — so this must stay after it.
      - name: Verify the Content-Security-Policy against every route
        run: timeout -k 20s 300s npm run verify:csp

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      # The source probe's own offline self-test belongs HERE, in the job that
      # runs on every push and pull request — not in validate-sources, which is
      # workflow_dispatch only and therefore fires when someone remembers.
      #
      # It was written to exit non-zero precisely so a build could fail on it,
      # and then nothing ran it. A check that cannot fail a build is the defect
      # this repository spent the day removing from its data; it was sitting in
      # its own tooling. The self-test needs no network, which is what makes it
      # safe to run everywhere and pointless to gate behind a dispatch.
      - name: Test the scraper parsers
        working-directory: backend/scrapers
        run: |
          python discover_treasury.py --selftest
          python test_common.py
          python test_cbk_parser.py
          python test_registry.py
          python test_cbr_history.py
          python test_cpi_history.py
          python test_cpi_contiguity.py
          python test_freshness_budgets.py
          python test_sources.py
          python test_auction_results.py
          python test_calendar_parser.py
          python test_refresh_calendar.py
          python test_expand_universe.py
          python test_worldbank.py
          python test_check_archive.py
          python test_healthcheck.py
          python test_macro_parser.py
          python test_treasury_debt.py
          python test_qebr.py
          python test_qebr_parser.py
          python test_afdb_licence.py
          python test_unreachable.py
          # Must come last: it asserts every file above is actually invoked.
          python test_ci_runs_every_test.py
      # Every other check in this repository asks whether a source is REACHABLE
      # or whether data is FRESH. Neither would have caught the worst bug found
      # so far, because it produced values that were individually plausible and
      # collectively impossible — one bond recorded with the auction's total,
      # and nothing in the archive disagreeing. This looks for contradictions
      # instead of gaps, and gates only on records the CURRENT parser produced,
      # so a version bump awaiting its re-read cannot block the very change that
      # repairs it.
      - name: Check the auction archive for contradictions
        working-directory: backend/scrapers
        run: python check_archive.py

  validate-sources:
    # Probes the live CBK / KNBS / Treasury / World Bank endpoints from a
    # network-open runner and prints a reachability report. Changes nothing.
    #
    # The job-level bound is not belt-and-braces. Thirteen of this job's
    # seventeen steps set no timeout of their own, every one of them waits on a
    # third party, and GitHub's default job limit is SIX HOURS. That is not
    # hypothetical: "Probe government sources we credit but do not fetch"
    # — Treasury, KNBS, IMF — hung for over thirty minutes on one run, holding
    # its runner and every step behind it, including the multi-bond probe that
    # was the reason for the dispatch. It also starved the runner pool, which
    # made unrelated CI look slow and had me blaming my own dispatch rate.
    #
    # One bound on the job covers all seventeen steps and every step added
    # later, which per-step timeouts do not: the step that hung was the one
    # nobody had thought to bound. Twenty minutes is roughly twice a healthy
    # run. This job only reports — nothing it produces is committed — so
    # cutting it short costs a diagnostic, never data.
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Probe live data sources
        working-directory: backend/scrapers
        run: python validate.py
      # validate.py asks whether the page is REACHABLE and contains a marker.
      # Both stayed green for the seventeen days USD/KES was frozen, because
      # the marker it checks on the CBK home page is "Central Bank Rate" — a
      # different indicator on the same page. This exercises the actual
      # patterns the pipeline depends on, which is the one question neither
      # validate.py nor the fixture-based test_sources.py could answer.
      - name: Probe whether the declared routes still match the live pages
        timeout-minutes: 4
        working-directory: backend/scrapers
        run: python probe_routes.py || echo "route probe failed — see output above"
      - name: Dry-run the macro scraper
        if: ${{ !inputs.validate_only }}
        working-directory: backend/scrapers
        run: python macro_parser.py || echo "macro scraper failed — see output above"
      - name: Probe candidate sources (CBK Weekly Bulletin, CMA)
        working-directory: backend/scrapers
        run: python discover_sources.py
      - name: Probe CBK HTML data tables (CBR history)
        working-directory: backend/scrapers
        run: python discover_cbk_tables.py
      - name: Probe CBK auction results (coupon rates, clearing yields)
        working-directory: backend/scrapers
        run: python discover_auction_results.py
      - name: Probe government sources we credit but do not fetch (Treasury, KNBS, IMF)
        working-directory: backend/scrapers
        run: python discover_treasury.py
      # A short budget on purpose. This job exists to prove the parser still
      # reads CBK's live tables, which a handful of files settles; building the
      # archive is refresh-data's work and its result is thrown away here. The
      # two jobs run concurrently, and on the first incremental dispatch they
      # raced each other through 280 PDFs — one finished in five minutes while
      # the other was still going at twenty-eight. Reading fewer files here
      # makes the check faster AND the real run reliable.
      #
      # The file count is now stated here rather than inherited. It used to come
      # from MAX_NEW_PER_RUN, which was 120 and has been raised to 500 so that a
      # parser fix reaches every record it corrects in one run — the right value
      # for refresh-data and the wrong one for a smoke test. Without this the
      # dry run would be bounded only by its 90 seconds, quietly turning "a
      # handful of files" into as many as ninety seconds buys, against the same
      # server the real run is reading concurrently.
      - name: Dry-run the auction results parser
        working-directory: backend/scrapers
        env:
          AUCTION_TIME_BUDGET: 90
          AUCTION_MAX_FILES: 25
        run: python auction_results.py || echo "auction parser failed — see output above"
      - name: Probe whether undated auctions carry their date in the document
        if: ${{ !inputs.test_alert && !inputs.test_recovery }}
        timeout-minutes: 5
        working-directory: backend/scrapers
        run: python probe_undated.py || echo "undated probe failed — see output above"

      - name: Probe why no tap sale has ever parsed completely
        if: ${{ !inputs.test_alert && !inputs.test_recovery }}
        timeout-minutes: 4
        working-directory: backend/scrapers
        run: python probe_tapsale.py || echo "tap-sale probe failed — see output above"

      - name: Probe what is still missing at the current parser version
        if: ${{ !inputs.test_alert && !inputs.test_recovery }}
        timeout-minutes: 5
        working-directory: backend/scrapers
        run: python probe_gaps.py || echo "gap probe failed — see output above"
      - name: Probe why some 2020-2023 auction results parse to nothing
        working-directory: backend/scrapers
        run: python discover_old_layout.py
      - name: Probe prospectuses for coupon dates and day-count convention
        working-directory: backend/scrapers
        run: python discover_prospectus.py
      # auctions.json is hand-maintained and nothing here writes it, which is
      # why Auction Radar has one placeholder entry and the prediction ledger
      # has never recorded a forecast. This asks whether the prospectuses can
      # supply the calendar, and above all how many bonds one document sells —
      # cbk_parser.py reads only the first code, and the July 2026 prospectus
      # sells three.
      - name: Probe whether the auction calendar can be built from prospectuses
        timeout-minutes: 6
        working-directory: backend/scrapers
        run: python probe_calendar.py || echo "calendar probe failed — see output above"
      # About one file in ten from 2020-2023 parses to nothing. Three very
      # different causes are possible — a scan with no text layer (which the
      # no-OCR policy would settle), a header the parser looks for along the
      # wrong axis, or a code spelling one regex away. This prints enough to
      # tell them apart instead of guessing, the same look-before-building step
      # that turned the MPC table into eighteen years of rate history.
      #
      # MOVED TO LAST, and the reason is mundane and cost me an afternoon. This
      # job's log is read through an API that returns the TAIL. Running first
      # among nine probes put this one's output permanently out of reach: three
      # separate fetches, each pulling more lines, never got back far enough,
      # while the probes that matter less were read every time. A diagnostic
      # nobody can retrieve is not a diagnostic.
      # The IMF landing page is prose; the numbers live in a keyless JSON API,
      # the same shape as the World Bank call this project already makes. This
      # container's egress refuses imf.org at CONNECT, so the runner is the
      # honest instrument — as it is for the Treasury.
      - name: Probe IMF country data (API, not the landing page)
        timeout-minutes: 5
        working-directory: backend/scrapers
        run: python probe_imf.py || echo "IMF probe failed — see output above"
      - name: Check data freshness
        working-directory: backend/scrapers
        run: python healthcheck.py

  probe-multibond:
    # The multi-bond probe on its own, because sharing a job with nineteen other
    # network-bound steps made it unobtainable twice in a row.
    #
    # First it ran FIRST, and this job's log is fetched by tail, so its output
    # sat beyond reach — three fetches pulling more lines each time never got
    # back to it. Moving it last fixed that and produced the answer.
    #
    # Then, moved last, it became hostage to everything ahead of it: the
    # Treasury/KNBS/IMF probe hung for over thirty minutes on one run, and the
    # CBK Weekly Bulletin probe on the next, so the job's own timeout now
    # expires before step twenty is reached. A bound that protects the runner
    # pool does not deliver a diagnostic.
    #
    # Alone it has one dependency — the CBK results PDFs it reads — and a log
    # short enough that the tail IS the output. It reads two or three documents
    # and writes nothing, so it can also be run on its own without paying for
    # the full source sweep.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Probe why multi-bond auctions yield only one bond's figures
        working-directory: backend/scrapers
        run: python probe_multibond.py || echo "multi-bond probe failed — see output above"

  probe-debt-sources:
    # Alone, and dispatch-only, for the reason probe-multibond is: a diagnostic
    # sharing a job with network-bound neighbours is a diagnostic one hung host
    # away from never being read.
    #
    # It exists because the question cannot be answered from a development
    # container. The sandbox's gateway answers 403 to CONNECT for every one of
    # these hosts, so a local probe reports the proxy's policy rather than the
    # source's. This runner has real egress; the answer it prints is about the
    # World Bank, the IMF and FRED, which is the answer we actually need.
    #
    # It writes nothing and commits nothing. Read the log, then decide.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Probe who serves Kenya debt-to-GDP in a machine-readable form
        working-directory: backend/scrapers
        run: python probe_debt_sources.py || echo "debt-source probe failed — see output above"

      - name: Probe the Treasury's monthly debt bulletin
        # The only candidate that is ALREADY a permitted source, so the open
        # question is machine-readability rather than licensing — unlike FRED
        # (bars commercial redistribution) and the IMF (projections, not
        # outturns). Bounded in the shell, not with timeout-minutes: a
        # `timeout-minutes` kill bypasses the `||` guard and skips every later
        # step, which is exactly how the World Bank step once took six
        # scrapers and the freshness gate down with it (#176).
        working-directory: backend/scrapers
        run: timeout -k 20s 240s python probe_treasury_debt.py || echo "treasury-debt probe failed — see output above"

      - name: Probe the QEBR for the sovereign panel's missing denominators
        # The debt bulletin answered a different question: it carries debt/GDP
        # and Ksh absolutes, none of which are the seven RATIOS the panel
        # shows. A ratio needs both halves, so this reports per-ratio rather
        # than per-indicator. Bounded in the shell, not with timeout-minutes
        # (#176). Runs after the debt probe because they share a host.
        working-directory: backend/scrapers
        run: timeout -k 20s 240s python probe_qebr.py || echo "QEBR probe failed — see output above"

      - name: Probe whether the AfDB actually carries quarterly Kenyan GDP
        # Connectivity was settled by the step above: all six AfDB URLs answer
        # 200 and /api/1.0/meta/dataset returns 202 records for Kenya. That is
        # not the same as carrying the series we want, and "the AfDB publishes
        # Kenyan statistics" is not "the AfDB publishes Kenya's QUARTERLY GDP".
        #
        # It also re-asks the licence question. The CC BY 4.0 claim came from a
        # search snippet and the markers were absent from the fetched HTML, so
        # it is currently unverified — and republishing on an unread licence is
        # the one failure here that would be ours rather than a publisher's.
        #
        # Bounded in the shell, not with timeout-minutes (#176).
        working-directory: backend/scrapers
        run: timeout -k 20s 240s python probe_afdb_coverage.py || echo "AfDB coverage probe failed — see output above"

      - name: Probe KNBS for quarterly GDP and its release calendar
        # Asked here rather than from a development container for the reason
        # this whole job exists: the sandbox 403s the CONNECT to knbs.or.ke, and
        # fiscal-context.json records what happens when that is mistaken for a
        # fact about the source — PDMO was written up as geo-blocked while
        # answering 200 on three consecutive runs from a runner like this one.
        #
        # The release calendar is the real prize, and it is not the GDP figure.
        # Every stale-data guard in this repo fires on a hand-set date; a guard
        # that knew KNBS's own published schedule would stop being a guess.
        #
        # Bounded in the shell, not with timeout-minutes (#176), and last
        # because it is the only step here that does not share a host with its
        # neighbours.
        working-directory: backend/scrapers
        run: timeout -k 20s 240s python probe_knbs_gdp.py || echo "KNBS probe failed — see output above"

      - name: Dry-run the QEBR parser against the live document
        # DRY RUN: prints what it would extract and writes nothing. Proving
        # three figures can be read is a different decision from publishing
        # them, and the World Bank figures they would replace are honest about
        # their own age in the meantime. Bounded in the shell, not with
        # timeout-minutes (#176).
        working-directory: backend/scrapers
        run: timeout -k 20s 240s python qebr_parser.py --diagnose || echo "QEBR parser dry run failed — see output above"

      # THE TABLES, WHICH extract_text CANNOT REACH.
      #
      # qebr_parser.py refuses Interest / government revenue because the
      # numerator is absent from the first 25 pages of PROSE. The denominator
      # is present. Q2's prose points at "table 5: expenditure and net
      # lending", and extract_text flattens table cells — a row's label and its
      # number can land on different lines — so a figure inside a fiscal table
      # is not reliably reachable by any pattern over that text.
      #
      # This reads the tables directly, across all pages of the two newest
      # documents, and prints the rows with their headers. It writes nothing
      # and decides nothing: whether a ratio can honestly be published depends
      # on the period and the basis in the header, which is a judgement to make
      # against the table rather than against a plausible match.
      #
      # `|| echo` because a probe that cannot reach a source should record that
      # and let the rest of the job run — the discipline for scrapers, not for
      # the browser suite.
      - name: Probe the QEBR fiscal tables for total interest
        working-directory: backend/scrapers
        run: timeout -k 20s 300s python probe_qebr_tables.py || echo "QEBR table probe failed — see output above"

      - name: Probe whether a CPI series exists to read
        # Shares this job rather than getting its own because it is the same
        # kind of question against overlapping hosts, and both logs are short
        # enough that the tail reaches them. It runs SECOND so that a hang on
        # CBK — which has taken thirty minutes on the validate-sources job —
        # cannot cost us the debt answer that already works.
        working-directory: backend/scrapers
        run: python probe_cpi_history.py || echo "CPI-history probe failed — see output above"

  refresh-data:
    # Netlify redeploys automatically when this job pushes updated JSON to main.
    if: github.event_name == 'schedule' || inputs.test_alert || inputs.test_recovery || inputs.refresh_now
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      # Each scraper is allowed to fail without aborting the others — partial
      # data is fine thanks to carry_forward() — but every failure is RECORDED
      # and surfaced at the end. Silently swallowing them is how a pipeline
      # dies unnoticed.
      # TIMEOUTS ARE IN THE SHELL, NOT IN `timeout-minutes`, AND THAT IS THE FIX.
      #
      # Every scraper below ends in `|| echo "failed=..." >> $GITHUB_OUTPUT`.
      # That construction exists so a failing scraper is RECORDED and reported
      # by the alert step, without aborting the run and skipping the scrapers
      # that come after it.
      #
      # `timeout-minutes` defeats it completely. When the bound is hit, GitHub
      # kills the shell and marks the step FAILED — the `||` never executes, so
      # nothing is recorded, and every later step in the job is skipped because
      # their `if:` carries no status function.
      #
      # This is not theoretical. On 2026-08-07 the World Bank step hit its
      # six-minute bound at 6m12s. The macro scraper had already run, so
      # USD/KES refreshed correctly — but the CBK securities register, auction
      # results, CBR history, CPI history, the bond universe and the auction
      # calendar were all SKIPPED, and so was `Check data freshness`, which is
      # the gate that would have noticed. Seven steps carried the same pairing.
      #
      # `timeout` in the shell returns 124 instead, so the `||` fires: the
      # failure is recorded, the alert names it, the step exits 0, and the rest
      # of the pipeline runs. -k sends KILL if the process ignores TERM.
      - name: Run macro scraper
        if: ${{ !inputs.test_alert && !inputs.test_recovery }}
        id: macro
        working-directory: backend/scrapers
        run: timeout -k 20s 300s python macro_parser.py || echo "failed=macro" >> "$GITHUB_OUTPUT"
      - name: Refresh World Bank sovereign context (keyless, CC BY 4.0)
        if: ${{ !inputs.test_alert && !inputs.test_recovery }}
        id: worldbank
        working-directory: backend/scrapers
        # 600s, not 360s. worldbank.py stops ITSELF at BUDGET_SECONDS (480s =
        # every indicator at full timeout); this bound is the backstop for a
        # hang, so it must sit above the budget or the process never gets to
        # use it. At 360s the shell would have killed a scraper that was still
        # inside its own budget — reintroducing #176 by the back door.
        run: timeout -k 20s 600s python worldbank.py || echo "failed=worldbank" >> "$GITHUB_OUTPUT"
      - name: Reconcile bonds against the CBK securities register
        if: ${{ !inputs.test_alert && !inputs.test_recovery }}
        id: registry
        working-directory: backend/scrapers
        # Bounded like the rest. This one had no bound at all — not
        # `timeout-minutes`, not a shell timeout — and it reads CBK over
        # the network, so it could have hung until the job-level limit.
        # Found by the test below rather than by inspection.
        run: timeout -k 20s 300s python registry.py || echo "failed=registry" >> "$GITHUB_OUTPUT"
      - name: Capture CBK auction results (coupon rates, clearing yields)
        if: ${{ !inputs.test_alert && !inputs.test_recovery }}
        id: auctions
        working-directory: backend/scrapers
        run: timeout -k 20s 900s python auction_results.py || echo "failed=auction-results" >> "$GITHUB_OUTPUT"
      - name: Capture CBK Central Bank Rate history
        if: ${{ !inputs.test_alert && !inputs.test_recovery }}
        id: cbr
        working-directory: backend/scrapers
        run: timeout -k 20s 300s python cbr_history_parser.py || echo "failed=cbr-history" >> "$GITHUB_OUTPUT"
      - name: Capture CBK monthly inflation history
        # Sits beside the CBR history because it is the same shape of job on
        # the same site: one HTML table, read by column name. Allowed to fail
        # without aborting the run, like every other scraper here, but the
        # failure is recorded — cpi-history.json is what makes realSeries()
        # return anything at all, so a silent loss would put every real-terms
        # surface back to rendering nothing.
        if: ${{ !inputs.test_alert && !inputs.test_recovery }}
        id: cpi
        working-directory: backend/scrapers
        run: timeout -k 20s 300s python cpi_history_parser.py || echo "failed=cpi-history" >> "$GITHUB_OUTPUT"
      - name: Expand the bond universe from the register + auction results
        if: ${{ !inputs.test_alert && !inputs.test_recovery }}
        id: expand
        working-directory: backend/scrapers
        run: timeout -k 20s 300s python expand_universe.py || echo "failed=expand-universe" >> "$GITHUB_OUTPUT"
      # Runs even when a scraper above was killed on its timeout. Without this
      # a single hung third-party fetch discards every other scraper's work:
      # a since-removed exchange-price step once held a completed auction-archive
      # rebuild for over twenty minutes with nothing committed, and GitHub's
      # default job limit is six hours. Partial data that is fresh beats complete data that never
      # ships, and the freshness check below still reports anything stale.
      # Record the bid assistant's range for upcoming auctions BEFORE they
      # close, and score past predictions against published results — the
      # append-only ledger behind the track record on /auctions. Runs after
      # the scrapers so it sees today's auction results; failure must not
      # block the data commit, but is surfaced like a scraper failure.
      # The calendar must refresh BEFORE the ledger runs: the ledger records a
      # forecast only for a future auction with named bonds, and this is what
      # names them. Ordering is the whole point — see refresh_calendar.py.
      - name: Refresh the auction calendar from CBK prospectuses
        if: ${{ !inputs.test_alert && !inputs.test_recovery }}
        id: calendar
        working-directory: backend/scrapers
        run: timeout -k 20s 300s python refresh_calendar.py || echo "failed=calendar" >> "$GITHUB_OUTPUT"
      - name: Update the prediction ledger
        if: ${{ !cancelled() && !inputs.test_alert && !inputs.test_recovery }}
        id: predictions
        run: |
          { npm ci --ignore-scripts \
            && npm run build:engine \
            && node scripts/update-predictions.mjs; } \
            || echo "failed=predictions" >> "$GITHUB_OUTPUT"
      # Republish the computed rates feed from the freshly scraped figures.
      # Separate from the ledger step so a ledger failure cannot silently
      # leave consumers reading yesterday's yields — this is the file other
      # products build on. Depends on build:engine having run above.
      - name: Rebuild the published rates feed
        if: ${{ !cancelled() && !inputs.test_alert && !inputs.test_recovery }}
        id: rates
        run: node scripts/build-rates-feed.mjs || echo "failed=rates-feed" >> "$GITHUB_OUTPUT"
      # BEFORE the commit, deliberately.
      #
      # This writes public/data/freshness.json — the per-dataset verdict the
      # site's banner reads. The gating run of the same script is further down,
      # AFTER the push, because it must see the committed state and because a
      # non-zero exit there is what raises the alert. If publishing ran there
      # too, the file would be written after the only step that could commit
      # it and would ship a full run late — describing the previous refresh
      # while sitting beside this one's data.
      #
      # --publish always exits 0. It is not the gate; it only records what the
      # gate is about to find.
      - name: Publish per-dataset freshness for the site
        if: ${{ !cancelled() && !inputs.test_alert && !inputs.test_recovery }}
        working-directory: backend/scrapers
        run: python healthcheck.py --publish

      - name: Commit updated data
        if: ${{ !cancelled() && !inputs.test_alert && !inputs.test_recovery }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The CSV as well as the JSON. build-rates-feed.mjs writes both and
          # this line staged only the JSON, so for as long as that has been
          # true the published CSV has been frozen at whatever was last
          # committed by hand while the JSON refreshed daily. Both are served
          # from /data/ and documented as the same figures; on the day this was
          # found they disagreed by 3 to 11 basis points across four bands.
          #
          # Nothing caught it because the refresh job does not run the unit
          # tests, and the test that compares the two only sees a checkout. A
          # correct check, never pointed at the artifact after it changed.
          git add public/data/*.json public/data/*.csv
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): daily refresh $(date -u +%F)"
          # This job spends up to ten minutes reading PDFs before it gets here,
          # which is a wide window for someone to push. A bare push loses the
          # whole run to a non-fast-forward — it happened, costing 120 files of
          # work — so rebase onto whatever arrived and try again.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto the new tip"
            git pull --rebase origin "$GITHUB_REF_NAME" || {
              echo "rebase hit a conflict in the data files."
              echo "NOT resolving it automatically: a conflict here means someone"
              echo "edited data this job also regenerated, and picking a side"
              echo "silently is how a hand-checked figure gets overwritten."
              echo "Nothing is lost — these PDFs stay unread and the next run"
              echo "re-derives them."
              exit 1
            }
          done
          git push

      - name: Check data freshness
        id: health
        working-directory: backend/scrapers
        env:
          # Forces every budget to 0 days so the real staleness path fires.
          HEALTHCHECK_STRICT: ${{ inputs.test_alert && '1' || '0' }}
        run: python healthcheck.py

      # Deliberately AFTER the freshness check rather than before it, so that
      # healthcheck-report.txt exists when the alert step below reads it. A
      # contradiction found here raises the same issue a stale source does,
      # which is right: both mean the published figures should not be trusted,
      # and this one means they are actively wrong rather than merely old.
      - name: Check the auction archive for contradictions
        id: integrity
        if: ${{ !cancelled() && !inputs.test_alert && !inputs.test_recovery }}
        working-directory: backend/scrapers
        run: python check_archive.py 2>&1 | tee archive-integrity.txt; exit "${PIPESTATUS[0]}"

      - name: Raise an alert
        # WHY NOT `failure()`, WHICH IS WHAT THIS WAS
        #
        # Every scraper step above ends in `|| echo "failed=..." >>
        # $GITHUB_OUTPUT`. That construction exits 0 by design, so a scraper
        # dying can never fail the job — and the nine `outputs.failed` values
        # this script reads were read NOWHERE ELSE. The recording mechanism
        # disabled the only alarm that consumed it: a value written precisely
        # so a failure would be noticed, gated behind a condition the writing
        # of it prevents.
        #
        # The comment on the scraper block says "every failure is RECORDED and
        # surfaced at the end. Silently swallowing them is how a pipeline dies
        # unnoticed." The recording was real. The surfacing was not.
        #
        # Not theoretical. The World Bank scraper spent days returning 400s and
        # correctly refusing to overwrite context.json with a collapsed set.
        # Every one of those runs recorded `failed=worldbank` and finished
        # green. It came to light because a human asked, not because the
        # pipeline said anything — and context.json's freshness budget is 900
        # days, so on the current path nothing here would have raised it for
        # over two years.
        #
        # Now runs whenever the job was not cancelled and decides for itself
        # whether there is anything worth saying, so a scraper that fails every
        # day is heard on the first one.
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let detail = '';
            try {
              detail = fs.readFileSync('backend/scrapers/healthcheck-report.txt', 'utf8');
            } catch { detail = '(no freshness report — a scraper step failed before the check ran)'; }

            // A contradiction is a different animal from staleness and deserves
            // to be named as one: stale data is old and says so, a contradiction
            // is a wrong figure wearing the clothes of a right one.
            const brokeIntegrity = '${{ steps.integrity.outcome }}' === 'failure';
            let integrity = '';
            if (brokeIntegrity) {
              try {
                integrity = fs.readFileSync('backend/scrapers/archive-integrity.txt', 'utf8');
              } catch { integrity = '(the check failed but wrote no report)'; }
            }

            const failed = [
              '${{ steps.macro.outputs.failed }}',
              '${{ steps.worldbank.outputs.failed }}',
              '${{ steps.registry.outputs.failed }}',
              '${{ steps.auctions.outputs.failed }}',
              '${{ steps.calendar.outputs.failed }}',
              '${{ steps.expand.outputs.failed }}',
              '${{ steps.cbr.outputs.failed }}',
              '${{ steps.cpi.outputs.failed }}',
              '${{ steps.predictions.outputs.failed }}',
              '${{ steps.rates.outputs.failed }}',
            ].filter(Boolean);

            /* Nothing to report is the common case now that this step runs on
             * every completed run. Returning silently is the whole point: an
             * alert that fires daily regardless of state is the wolf-crying
             * the freshness budgets were widened to avoid. */
            const healthFailed = '${{ steps.health.outcome }}' === 'failure';
            const jobFailed = '${{ job.status }}' === 'failure';
            const label = 'scraper-alert';

            /* THE RECOVERY PATH HAD NO SELF-TEST, WHICH IS THE HALF THAT
             * MATTERS MORE.
             *
             * `test_alert` proves the alarm can be RAISED, and its comment
             * gives the reason: so it "can be proven to still work after
             * anyone edits it, rather than being discovered broken on the day
             * it was needed". Every word of that applies to standing the alarm
             * down, and nothing exercised it.
             *
             * It is also the harder half to notice when broken. A raise that
             * stops working is loud — the issue everyone expected never
             * appears. A close that stops working is silent: issues simply
             * accumulate, `open` quietly decays from "still true" to "was true
             * once", and by the time anyone notices, the signal is already
             * worthless. As of this commit the recovery branch had never
             * executed against a real issue — #179 was closed by hand.
             *
             * So the self-test manufactures the one precondition the branch
             * needs and cannot arrange for itself: an OPEN alert on a healthy
             * run. It raises a throwaway, clearly-labelled issue and then falls
             * straight into the ordinary recovery code below — not a copy of
             * it. A self-test that exercised a duplicate would prove the
             * duplicate works. */
            const testRecovery = '${{ inputs.test_recovery }}' === 'true';
            let selfTestIssue = null;
            if (testRecovery) {
              const made = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Self-test of the recovery path — run ${context.runId}`,
                labels: [label],
                body: [
                  '## This is a self-test, not a fault',
                  '',
                  'Raised deliberately by a `test_recovery` dispatch so the',
                  'recovery branch has an open alert to close. If this issue is',
                  'still OPEN with a "Recovered" comment absent, the recovery',
                  'path is broken and that is the finding.',
                  '',
                  `[View the run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                ].join('\n'),
              });
              core.info(`Self-test raised #${made.data.number}; the recovery branch must now close it.`);
              selfTestIssue = made.data.number;

              /* WAIT FOR THE INDEX, BECAUSE listForRepo IS EVENTUALLY
               * CONSISTENT AND 240ms WAS NOT ENOUGH.
               *
               * The first live dispatch failed with "the close path is
               * broken", and the close path was fine. The issue was created at
               * 13:29:38.12 and the list ran at 13:29:38.36; GitHub had not
               * indexed it yet, so the recovery loop iterated over nothing and
               * the assertion below fired against a defect that did not exist.
               *
               * Worse, the SECOND dispatch then passed green — it closed the
               * FIRST run's issue, which by then was indexed, while leaving
               * its own open. One leaked issue per run, and a self-test
               * reporting success for closing something it did not raise.
               *
               * Polling until the new issue is visible removes both. */
              for (let attempt = 0; attempt < 10; attempt++) {
                const seen = await github.rest.issues.listForRepo({
                  owner: context.repo.owner, repo: context.repo.repo,
                  state: 'open', labels: label,
                });
                if (seen.data.some((i) => i.number === selfTestIssue)) break;
                core.info(`Waiting for #${selfTestIssue} to appear in the issue index...`);
                await new Promise((r) => setTimeout(r, 3000));
              }
            }

            if (testRecovery || (!failed.length && !healthFailed && !brokeIntegrity && !jobFailed)) {
              /* A RECOVERY MUST CLOSE THE ALERT, OR `open` STOPS MEANING
               * ANYTHING.
               *
               * This step could raise an alert and could never clear one. The
               * comment further down says an unchanged fault "stays visible as
               * an OPEN ISSUE, which is the right register for 'still true'" —
               * and that is exactly the load-bearing claim a missing close
               * breaks. Without this, `open` degrades from "still true" to
               * "was true once", and the next reader has to open the issue and
               * read timestamps to learn whether the pipeline is healthy right
               * now. An alarm that cannot be switched off is one people stop
               * switching on.
               *
               * It is also the mirror of the defect this repository keeps
               * finding in itself. A guard that cannot fire in the case it
               * exists to detect is useless; so is a guard that, once fired,
               * can never stand down.
               *
               * Closed with a comment rather than silently, so the issue is a
               * record of a fault that ended rather than one someone tidied
               * away. */
              const closedNumbers = [];
              const open = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: label,
              });
              for (const issue of open.data) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number,
                  body: [
                    '## Recovered',
                    '',
                    'A full run completed with every scraper exiting cleanly, every',
                    'freshness budget met, and no contradiction in the archive.',
                    '',
                    `[View the run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                    '',
                    'Closing automatically. If the fault returns, a new alert is raised',
                    'rather than this one reopened, so each issue covers one episode.',
                  ].join('\n'),
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed', state_reason: 'completed',
                });
                core.info(`Closed recovered alert #${issue.number}`);
                closedNumbers.push(issue.number);
              }
              /* The self-test must fail unless ITS OWN issue closed.
               *
               * `closed === 0` was the first version and it was too weak: the
               * second live dispatch closed the PREVIOUS run's issue, counted
               * one, and passed — while leaving the issue it had just raised
               * open. A guard that any close satisfies is satisfied by the
               * wrong close. */
              if (testRecovery && !closedNumbers.includes(selfTestIssue)) {
                core.setFailed(
                  `test_recovery raised #${selfTestIssue} and the recovery branch did not ` +
                  `close it (closed: ${closedNumbers.join(', ') || 'nothing'}). ` +
                  'Either the close path is broken, or the issue index did not catch up ' +
                  'within the polling window above.'
                );
              }
              return;
            }

            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Data pipeline needs attention',
              '',
              failed.length
                ? `**Scrapers that failed:** ${failed.join(', ')}`
                : brokeIntegrity
                  ? '**All scrapers exited cleanly, and the archive still contradicts itself.** This is not a crash and not a freshness problem.'
                  : healthFailed
                    ? '**All scrapers exited cleanly** — this is a freshness problem, not a crash.'
                    : '**A pipeline step failed before the data checks ran.** No scraper recorded a failure, so look at the run itself.',
              '',
              ...(brokeIntegrity ? [
                '**Archive contradictions** — figures the current parser produced that cannot all be true:',
                '```',
                integrity.trim(),
                '```',
                '',
                'Unlike a gap, this data is already published and already wrong. Treat it ahead of anything else in this issue.',
                '',
              ] : []),
              '**Freshness report:**',
              '```',
              detail.trim(),
              '```',
              '',
              `[View the run](${run})`,
              '',
              brokeIntegrity
                ? 'The app is serving these figures now. `carry_forward` does not help here — it preserves the last good data, and a contradiction means the newest data was not good.'
                : 'The app keeps serving the last good data (see `carry_forward`), so nothing is broken for users yet — but the figures are ageing. Run the `validate-sources` job to see which sources are reachable.',
            ].join('\n');

            // `label` is declared above, where a recovery closes the open alert.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label,
            });

            if (existing.data.length) {
              const issue_number = existing.data[0].number;

              /* SAY IT ONCE, NOT ONCE A DAY.
               *
               * This commented on every failing run. That was survivable while
               * the alert was gated on `failure()` and so almost never fired —
               * the gate the scraper recording itself prevented. Now that it
               * fires on the FIRST failing day, an unchanged fault would post
               * an identical comment every morning, and these reach a human by
               * email. Thirty identical emails about one broken scraper is how
               * an alert becomes something you filter, which is the failure
               * this whole file keeps arguing against.
               *
               * So: post only when the situation has CHANGED. The run URL is
               * stripped before comparing because it differs every run and is
               * not news; everything else — which scrapers failed, what is
               * stale, what contradicts — is the substance. An unchanged fault
               * stays visible as an OPEN ISSUE, which is the right register
               * for "still true" as against "just happened". */
              const substance = (t) => t.replace(/^\[View the run\].*$/m, '').trim();
              const priorComments = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number, per_page: 100,
              });
              const mine = priorComments.data.filter((c) => c.user?.type === 'Bot');
              const last = mine.length ? mine[mine.length - 1].body : existing.data[0].body;

              if (substance(last || '') === substance(body)) {
                core.info('Alert unchanged since the last run — not commenting again.');
                return;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Data pipeline alert — ${new Date().toISOString().slice(0, 10)}`,
                labels: [label], body,
              });
            }
