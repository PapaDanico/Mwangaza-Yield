[build]
  command = "npm run build"
  publish = "out"
  # Exit 0 skips the build, non-zero runs it. See the script for why the list
  # of skippable paths is short and why every uncertain case builds.
  ignore = "bash scripts/netlify-should-build.sh"

# Deploy previews are OFF, and this is the line that turns them off.
#
# Netlify was building a preview for every pull request in addition to the
# production deploy for every merge — two charges per change, against a pool
# that hit zero and left two merged commits unpublished. Previews were roughly
# half of all build spend and were not being read: review here happens through
# CI, local screenshots and the diff, and no preview URL has been opened.
#
# `exit 0` cancels the build. To bring previews back, delete this block — not
# the [build] ignore above, which is a different and much cheaper saving.
[context.deploy-preview]
  ignore = "exit 0"

# Same reasoning for branch deploys. Nothing consumes them; every branch that
# matters becomes a pull request, and every pull request becomes a merge.
[context.branch-deploy]
  ignore = "exit 0"

# The site is a static export, and `track` is now the ONLY server code that
# exists — an anonymous tool counter holding no identifier of any kind.
#
# `subscribe` and `send-alerts` were removed in July 2026. Web push requires a
# server to hold each device's endpoint, and an endpoint identifies a specific
# person's phone: it is personal data regardless of how little else travels
# with it. Alerts are now evaluated on the device from the published calendar
# and rate feed, which is how coupon and maturity alerts always worked.
#
# Keeping this directory to one anonymous function is the point, not an
# accident. See src/app/privacy/page.tsx for what the reader is told.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# The rates feed is published FOR other people to read — see
# scripts/build-rates-feed.mjs and public/data/RATES-FEED.md. Cross-origin reads are
# therefore the point, not an oversight. This is a deliberate trade: the
# underlying figures are public CBK releases and the product being sold is the
# verified engine and its support, not gatekeeping a JSON file. An open feed
# that carries our attribution is worth more than a closed one nobody cites.
[[headers]]
  for = "/data/rates.json"
  [headers.values]
    Cache-Control = "public, max-age=900"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"

# The CSV is the same feed and needs the same treatment. It was added without
# this rule, so it fell through to the generic /data/* entry — served, cached
# for five minutes, and with NO Access-Control-Allow-Origin. A browser could
# download it by typing the URL and could not fetch() it from anywhere else,
# which is precisely the use it exists for: docs/REVENUE.md publishes it so an
# analyst evaluating a licence can pull it into their own sheet or dashboard
# without writing a JSON parser first. Content-Type is pinned because a feed
# meant to open in a spreadsheet should not depend on the extension being
# guessed correctly.
[[headers]]
  for = "/data/rates.csv"
  [headers.values]
    Content-Type = "text/csv; charset=utf-8"
    Cache-Control = "public, max-age=900"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"

# The contract document, served from the same directory as the feed it
# describes. It lived in docs/ and was linked from JiPange's public repo into
# this private one, so every third party the feed exists for hit a 404 at the
# moment they were deciding whether to trust it. Same CORS treatment as the
# data, because a contract nobody outside can read is not published.
[[headers]]
  for = "/data/RATES-FEED.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=900"
    Access-Control-Allow-Origin = "*"

# SECURITY HEADERS — added 2026-08-07, and the asymmetry is the point.
#
# JiPange has carried this exact block for some time. Mwangaza, which is the
# product that shows people money figures they may act on, had NO security
# headers at all: no X-Frame-Options, no nosniff, no Referrer-Policy. Every
# rule below was already agreed and already deployed on the sibling product;
# only this file was missed. Two codebases by the same hand drifting apart on
# something both had already decided is the ordinary way a gap like this opens.
#
# X-XSS-Protection IS DELIBERATELY ABSENT, AND ITS ABSENCE IS THE IMPROVEMENT.
# It enabled a legacy browser XSS auditor no current browser ships — Chrome
# removed it, Edge followed, Firefox never implemented it. Worse than inert
# historically: the auditor guessed which parts of a response were reflected
# input and neutralised them, and that guess was itself exploitable. Sending it
# advertises a protection that does not exist, and a reviewer scanning the
# header list ticks a box with nothing behind it.
#
# CONTENT-SECURITY-POLICY IS STILL NOT HERE, AND THAT REMAINS DELIBERATE.
# Next.js emits inline scripts and Tailwind emits inline styles, so a correct
# policy needs nonces threaded through the framework. A CSP that is wrong
# breaks the site in production ONLY — the one environment where this app's
# figures are the reason anybody visits. A starting policy of
# `script-src 'self'` would block Next's own hydration and take the
# calculators down while every test stayed green, which is the exact failure
# mode this repository has spent its effort learning to avoid.
#
# So it stays an honest, documented gap in both SECURITY.md files rather than a
# line added here to close a checklist item. Shipping the headers that ARE
# correct does not wait on the one that needs real work.
[[headers]]
  for = "/*"
  [headers.values]
    # A Content-Security-Policy, which SECURITY.md said this site did not have
    # and could not easily get. That was half right, and the half it got wrong
    # cost the site every directive below.
    #
    # The reasoning was: Next emits inline scripts, so a correct policy needs
    # nonces threaded through the framework, and a wrong CSP breaks production
    # only. Both true. But they are an argument about ONE directive —
    # script-src — and it was applied to the whole header, so object-src,
    # base-uri, form-action and frame-ancestors went unset too. Those need no
    # nonce, break nothing, and block real attacks: a <base> tag injection
    # repointing every relative URL, a form rewritten to exfiltrate to another
    # origin, a plugin-based payload.
    #
    # Measured against the actual build: 72 distinct inline scripts across 25
    # pages, nearly all of them Next's per-page RSC payload. Hashing them is
    # possible and was rejected — 72 hashes regenerated every build, where one
    # missed script breaks production silently, is a worse failure mode than
    # the honest 'unsafe-inline' below.
    #
    # SO script-src IS THE WEAK LINE AND IS LABELLED AS SUCH. It permits
    # inline script and therefore does not stop injected script. Everything
    # else is locked to same-origin. That is a smaller claim than "we have a
    # CSP" and a much larger one than "we have none".
    #
    # Verified rather than reviewed: scripts/verify-csp.mjs serves the built
    # site under THIS EXACT STRING, parsed from this file, and fails on any
    # console violation across every route. A directive that would break
    # production breaks CI instead. Confirmed to detect real breakage by
    # mutation — script-src 'none' and a bare script-src 'self' both trip it.
    Content-Security-Policy = """default-src 'self'; \
base-uri 'self'; \
object-src 'none'; \
frame-ancestors 'self'; \
form-action 'self'; \
img-src 'self' data: blob:; \
style-src 'self' 'unsafe-inline'; \
font-src 'self' data:; \
script-src 'self' 'unsafe-inline'; \
connect-src 'self'; \
manifest-src 'self'; \
worker-src 'self' blob:; \
upgrade-insecure-requests"""
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
