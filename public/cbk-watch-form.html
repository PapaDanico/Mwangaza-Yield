<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>cbk-watch</title></head>

     their CBK snapshots to. Not linked from the site; no reader submits it. -->

  <input name="at"><textarea name="extract"></textarea><textarea name="results"></textarea><textarea name="lookup"></textarea><textarea name="bulletin"></textarea><textarea name="tbill-history"></textarea><textarea name="monthly"></textarea><textarea name="monthly-real"></textarea><textarea name="monthly-external"></textarea>
  <textarea name="home"></textarea><textarea name="forex"></textarea><textarea name="tbills"></textarea><textarea name="bonds"></textarea>
  <textarea name="cbr"></textarea><textarea name="inflation"></textarea><textarea name="weekly-bulletin"></textarea><textarea name="monthly-indicators"></textarea><textarea name="gapdocs"></textarea>
</form>
</body></html>
