name: CI & Daily Data Refresh

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1-5' # 6am EAT, weekdays

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  refresh-data:
    # Netlify redeploys automatically when this job pushes updated JSON to main.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Run macro scraper (best-effort; keeps last good data on failure)
        working-directory: backend/scrapers
        run: python macro_parser.py || echo "macro scrape failed — keeping existing data"
      - name: Refresh World Bank sovereign context (keyless, CC BY 4.0)
        working-directory: backend/scrapers
        run: python worldbank.py || echo "World Bank refresh failed — keeping existing data"
      - name: Run NSE scraper
        working-directory: backend/scrapers
        env:
          NSE_DAILY_TRADE_URL: ${{ vars.NSE_DAILY_TRADE_URL }}
        run: python nse_parser.py || echo "NSE scrape failed — keeping existing data"
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): daily refresh $(date -u +%F)"
          git push
