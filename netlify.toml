[build]
  command = "npm run build"
  publish = "out"
  # Exit 0 skips the build, non-zero runs it. See the script for why the list
  # of skippable paths is short and why every uncertain case builds.
  ignore = "bash scripts/netlify-should-build.sh"

# Deploy previews are OFF, and this is the line that turns them off.
#
# Netlify was building a preview for every pull request in addition to the
# production deploy for every merge — two charges per change, against a pool
# that hit zero and left two merged commits unpublished. Previews were roughly
# half of all build spend and were not being read: review here happens through
# CI, local screenshots and the diff, and no preview URL has been opened.
#
# `exit 0` cancels the build. To bring previews back, delete this block — not
# the [build] ignore above, which is a different and much cheaper saving.
[context.deploy-preview]
  ignore = "exit 0"

# Same reasoning for branch deploys. Nothing consumes them; every branch that
# matters becomes a pull request, and every pull request becomes a merge.
[context.branch-deploy]
  ignore = "exit 0"

# The site is a static export, and `track` is now the ONLY server code that
# exists — an anonymous tool counter holding no identifier of any kind.
#
# `subscribe` and `send-alerts` were removed in July 2026. Web push requires a
# server to hold each device's endpoint, and an endpoint identifies a specific
# person's phone: it is personal data regardless of how little else travels
# with it. Alerts are now evaluated on the device from the published calendar
# and rate feed, which is how coupon and maturity alerts always worked.
#
# Keeping this directory to one anonymous function is the point, not an
# accident. See src/app/privacy/page.tsx for what the reader is told.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# The rates feed is published FOR other people to read — see
# scripts/build-rates-feed.mjs and public/data/RATES-FEED.md. Cross-origin reads are
# therefore the point, not an oversight. This is a deliberate trade: the
# underlying figures are public CBK releases and the product being sold is the
# verified engine and its support, not gatekeeping a JSON file. An open feed
# that carries our attribution is worth more than a closed one nobody cites.
[[headers]]
  for = "/data/rates.json"
  [headers.values]
    Cache-Control = "public, max-age=900"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"

# The CSV is the same feed and needs the same treatment. It was added without
# this rule, so it fell through to the generic /data/* entry — served, cached
# for five minutes, and with NO Access-Control-Allow-Origin. A browser could
# download it by typing the URL and could not fetch() it from anywhere else,
# which is precisely the use it exists for: docs/REVENUE.md publishes it so an
# analyst evaluating a licence can pull it into their own sheet or dashboard
# without writing a JSON parser first. Content-Type is pinned because a feed
# meant to open in a spreadsheet should not depend on the extension being
# guessed correctly.
[[headers]]
  for = "/data/rates.csv"
  [headers.values]
    Content-Type = "text/csv; charset=utf-8"
    Cache-Control = "public, max-age=900"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"

# The contract document, served from the same directory as the feed it
# describes. It lived in docs/ and was linked from JiPange's public repo into
# this private one, so every third party the feed exists for hit a 404 at the
# moment they were deciding whether to trust it. Same CORS treatment as the
# data, because a contract nobody outside can read is not published.
[[headers]]
  for = "/data/RATES-FEED.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=900"
    Access-Control-Allow-Origin = "*"
