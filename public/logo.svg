<!-- Traced from the brand sheet supplied 31 Jul 2026, which arrived as PNG
     only — no vector exists. Geometry was measured off the source rather than
     eyeballed: the navy disc was located by pixel extent, every landmark
     (apex, tack, boom tip, arc nadir, dot) transformed into this 512 viewBox,
     and the sail's width sampled at four heights to set the luff curvature.
     Fidelity is close but not exact. If the original vector ever surfaces,
     replace this file rather than editing it.

     Flat fills only, deliberately. The previous mark used two gradients, and
     gradients are the first thing to drop when an SVG is cloned or rasterised
     — which is exactly what the PDF export does through html2canvas, a path
     that has already lost styling twice in this codebase.

     width/height are load-bearing, not decoration. Without an intrinsic size
     an SVG falls back to its container when CSS has not applied, which is what
     html2canvas does in its clone: the report export then rendered this logo
     at the full 794px sheet width and the reader got a PNG of one giant navy
     corner instead of their bond ladder. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#05172C"/>
  <g fill="#F8AA1C">
    <!-- Lateen sail: convex leech on the right, deeply concave luff on the
         left tapering to a fine point at the tack. That taper is what gives
         the crescent read; flattening it turns the sail into a wedge. -->
    <path d="M 317 111 C 329 164, 327 236, 299 319
             C 266 303, 218 295, 182 313
             C 248 288, 296 196, 317 111 Z"/>
    <!-- Boom, tapering away from the tack. -->
    <path d="M 112 333 L 192 310 L 194 322 Z"/>
  </g>
  <!-- One arc doing two jobs: the hull the sail sits in, and a yield curve
       rising to the right. The terminating dot is the point being marked. -->
  <path d="M 152 340 Q 258 414, 358 336" fill="none" stroke="#F8AA1C" stroke-width="21" stroke-linecap="round"/>
  <circle cx="362" cy="332" r="23" fill="#F8AA1C"/>
</svg>
